name: Uji AES + KDC

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  uji:
    name: Uji ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            python: "3.12"
          - os: ubuntu-latest
            label: Ubuntu
            python: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Uji vektor AES dan protokol KDC
        run: python -m unittest test_aes -v

      - name: Uji end-to-end KDC + Alice + Bob
        run: python uji_end_to_end.py
