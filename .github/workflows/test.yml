name: Uji DES

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  uji:
    name: Uji ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            python: "3.12"
          - os: ubuntu-latest
            label: Ubuntu
            python: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Selftest vektor DES
        run: python sender_node-v3.py --selftest

      - name: Jalankan test_des.py
        run: python -m unittest test_des -v
